<!DOCTYPE html>
<html lang="en-GB">
<head>
    <title>Meet the Team | ROOMMATE</title>
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme-preference');
                var preferredTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-appearance', preferredTheme);
            } catch (error) {}
        }());
    </script>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <meta charset="UTF-8" />
    <meta name="description" content="The team behind ROOMMATE, the University of Ibadan hostel allocation portal." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        .credits-wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px; display: grid; gap: 32px; }
        .credits-intro { display: grid; gap: 12px; }
        .credits-intro h1 { margin: 0; }
        .credits-built { display: flex; flex-wrap: wrap; gap: 8px; }
        .credits-team { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .credits-member { display: flex; align-items: center; gap: 14px; }
        .credits-initials { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
            font-weight: 800; font-size: 14px; background: hsl(var(--primary) / .12); color: hsl(var(--primary)); }
        .credits-member h3 { margin: 0; font-size: 16px; }
        .credits-member p { margin: 2px 0 0; font-size: 13px; color: hsl(var(--muted-foreground)); }
    </style>
</head>
<body>
    <div id="navbar-placeholder">
        <header class="main-header">
            <nav class="nav-container" aria-label="Main navigation">
                <a href="index.html" class="main-logo">ROOMMATE</a>
                <button class="nav-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" onclick="toggleMobileNav()"><i data-lucide="menu" aria-hidden="true"></i></button>
                <div class="nav-links" id="main-navigation">
                    <a href="index.html#features">Features</a>
                    <a href="index.html#about">About</a>
                    <button class="btn-icon theme-toggle" type="button" onclick="toggleDarkMode()" aria-label="Switch to dark mode"><i data-lucide="sun" class="sun-icon"></i><i data-lucide="moon" class="moon-icon"></i></button>
                    <a href="pages/auth/login.html" class="btn btn-secondary">Login</a>
                </div>
            </nav>
        </header>
    </div>

    <main class="credits-wrap">
        <section class="credits-intro">
            <p class="text-sm text-muted-foreground tracking-wide">CREDITS</p>
            <h1>Meet the team.</h1>
            <p class="text-muted-foreground">ROOMMATE is the hostel allocation and payment portal for the University of Ibadan. Built by IFT Group 3 for the 2026/2027 session.</p>
            <div class="credits-built" id="built" aria-label="Built with"></div>
        </section>

        <section aria-labelledby="team-title">
            <h2 id="team-title" class="mb-6">IFT Group 3</h2>
            <div class="credits-team" id="team"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <div id="modal-placeholder"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
    <script>
        /* Add one object per member, e.g. { name: 'Full name', matric: '250000', role: 'Admin frontend' }.
           Text is placed on the page safely, so it can never run as code. A missing field is simply not shown. */
        const TEAM = [
            { name: 'Steve Victor', matric: '250410' },
            { name: 'Abisoye Oyinkansola Osikomaiya', matric: '250404' },
            { name: 'Akinwale Abdullah Titilayo', matric: '251123' },
            { name: 'Mba Chibuike Moses', matric: '250379' },
            { name: 'Ogunlana Gift Oluwafikayomi', matric: '250389' },
            { name: 'Ekundayo Covenant', matric: '256614' },
            { name: 'Okorie Victory Chinonso', matric: '243689' },
            { name: 'Anucha Chidera Destiny Victor', matric: '250356' },
            { name: 'Oluwatumininu Owolabi', matric: '249488' },
            { name: 'Oduntan Afolake', matric: '250385' },
            { name: 'Borokinni Yusuf Temitope', matric: '243673' },
            { name: 'Femi-Akinwande Benjamin', matric: '250366' }
        ];
        const BUILT_WITH = ['HTML', 'CSS', 'JavaScript', 'PHP', 'MySQL'];

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('navbar', 'navbar-placeholder');
            loadComponent('footer', 'footer-placeholder');
            loadComponent('modal', 'modal-placeholder');

            const built = document.getElementById('built');
            BUILT_WITH.forEach(tech => built.appendChild(el('span', 'badge badge-secondary', tech)));

            const team = document.getElementById('team');
            if (!TEAM.length) {
                team.appendChild(el('p', 'text-muted-foreground', 'The team list has not been filled in yet.'));
            }
            TEAM.forEach(member => {
                const initials = String(member.name || '?').split(/\s+/).map(word => word[0]).join('').slice(0, 2).toUpperCase();
                const card = el('article', 'card credits-member');
                card.appendChild(el('div', 'credits-initials', initials));
                const info = el('div');
                info.appendChild(el('h3', '', member.name));
                const detail = [member.role, member.matric].filter(Boolean).join(' · ');
                if (detail) info.appendChild(el('p', '', detail));
                card.appendChild(info);
                team.appendChild(card);
            });

            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
