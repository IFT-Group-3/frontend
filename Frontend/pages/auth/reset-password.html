<!DOCTYPE html>
<html lang="en-GB">
<head>
    <title>Set New Password | ROOMMATE</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/auth.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="auth-page">
    <div class="auth-visual">
        <div class="logo">
            <a href="../../index.html" class="main-logo">ROOMMATE</a>
        </div>
        <div class="quote-block">
            <blockquote>"Keeping student data secure is our top priority. Choose a strong password to protect your application."</blockquote>
            <div class="quote-author">
                <strong>University IT Services</strong><br>
                University of Ibadan
            </div>
        </div>
        <div class="auth-visual-footer">
            <p class="text-xs text-primary-foreground/50">&copy; 2026 University of Ibadan</p>
        </div>
    </div>

    <div class="auth-content">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Set new password</h1>
                <p>Please enter your new password below</p>
            </div>
            <div id="footer-placeholder"></div>

            <form class="auth-form" onsubmit="event.preventDefault(); handleReset(this);">
                <div class="form-group">
                    <label class="label" for="password">New Password</label>
                    <div class="password-field">
                        <input type="password" id="password" class="input" autocomplete="new-password" required minlength="8" oninput="updatePasswordStrength(this.value)" />
                        <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('password', this)">Show</button>
                    </div>
                    <div class="password-strength" aria-live="polite"><span id="password-strength-bar"></span><span id="password-strength-text">Use at least 8 characters</span></div>
                </div>

                <div class="form-group">
                    <label class="label" for="confirm-password">Confirm New Password</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" class="input" autocomplete="new-password" required minlength="8" oninput="validatePasswordMatch()" />
                        <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('confirm-password', this)">Show</button>
                    </div>
                    <p id="reset-error" class="error-message" role="alert" hidden></p>
                </div>

                <button type="submit" id="reset-btn" class="btn btn-primary w-full">
                    Reset Password
                </button>
                
                <a href="login.html" class="btn btn-secondary w-full">
                    Cancel
                </a>
            </form>

            <div class="auth-footer">
                <div class="mt-4">
                    <a href="javascript:void(0)" onclick="openLegalModal()" class="text-xs text-muted-foreground hover:text-foreground">License & Legal</a>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-placeholder" style="position: absolute;"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('modal', 'modal-placeholder');
            loadComponent('footer', 'footer-placeholder');
            if (window.lucide) window.lucide.createIcons();
        });

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
            button.textContent = input.type === 'password' ? 'Show' : 'Hide';
            button.setAttribute('aria-label', `${button.textContent} password`);
        }

        function updatePasswordStrength(value) {
            const score = [value.length >= 8, /[A-Z]/.test(value), /[0-9]/.test(value), /[^A-Za-z0-9]/.test(value)].filter(Boolean).length;
            const labels = ['Use at least 8 characters', 'Weak password', 'Good password', 'Strong password', 'Very strong password'];
            document.getElementById('password-strength-bar').style.width = `${score * 25}%`;
            document.getElementById('password-strength-text').textContent = labels[score];
        }

        function validatePasswordMatch() {
            const password = document.getElementById('password');
            const confirm = document.getElementById('confirm-password');
            const error = document.getElementById('reset-error');
            const matches = !confirm.value || password.value === confirm.value;
            confirm.classList.toggle('is-invalid', !matches);
            confirm.classList.toggle('is-valid', matches && confirm.value.length > 0);
            error.textContent = matches ? '' : 'Passwords do not match.';
            error.hidden = matches;
            return matches;
        }

        function handleReset(form) {
            const btn = document.getElementById('reset-btn');
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            if (!validatePasswordMatch()) {
                showToast('Passwords do not match', 'error');
                return;
            }
            document.getElementById('reset-error').hidden = true;

            setBtnLoading(btn, true);
            
            // Simulate API call
            setTimeout(() => {
                setBtnLoading(btn, false);
                showToast('Password updated successfully!');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }, 1500);
        }
    </script>
</body>
</html>
