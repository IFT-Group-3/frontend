<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme-preference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-appearance',t)}catch(e){}}());</script>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/admin.css"><title>Students | Hostel Administration</title></head>
<body class="a-body">
<main id="content">
  <div class="a-toolbar"><div class="a-find"><span class="fi"></span><input class="a-input" type="search" placeholder="Search students" aria-label="Search students"></div>
    <select class="a-input" id="f-dept" aria-label="Filter by department"><option value="">Department</option></select>
    <select class="a-input" id="f-level" aria-label="Filter by level"><option value="">Level</option></select>
    <select class="a-input" id="f-status" aria-label="Filter by allocation status"><option value="">Allocation status</option><option value="allocated">Allocated</option><option value="pending">Pending</option><option value="unallocated">Unallocated</option></select>
  </div>
  <div class="a-split"><div><div class="a-rows" id="list"></div><div class="a-pager" id="pager" style="margin-top:12px"></div></div>
  <aside class="a-card a-panel" id="panel" aria-live="polite"></aside></div></main>
<script src="../../js/admin.js"></script>
<script>
const { ADMIN, esc, aval, naira, wait, failure, fetchJson, adminApi, adminSession, aicon, abadge, aState, aToast, mountAdminShell, bindSearch, pendingFeature, tableHtml, pagerHtml, kpiHtml, summaryHtml, fillSelect, downloadCsv } = AdminKit;
mountAdminShell({ active: 'students', title: 'Students', subtitle: 'Search student accommodation records.', searchPlaceholder: 'Search students' });
document.querySelectorAll('.fi').forEach(function (e) { e.innerHTML = aicon('search'); });
var list = document.getElementById('list'), pager = document.getElementById('pager'), panel = document.getElementById('panel');
var all = [], total = 0, q = '', dept = '', level = '', stat = '', page = 1, PER = 5, selected = null;
var place = function (s) {
  var a = (window.adminDashboardAllocations || []).find(function (x) { return Number(x.user_id) === Number(s.user_id); });
  return a ? aval(a.hostel_name) + ' ' + aval(a.room_number) + ' ' + aval(a.bed_number) : 'Not allocated';
};
var COLS = [
  { label: 'Student ID', cell: function (s) { return esc(aval(s.student_id)); } },
  { label: 'User ID', cell: function (s) { return esc(aval(s.user_id)); } },
  { label: 'Matric', cell: function (s) { return '<strong>' + esc(aval(s.matric_number)) + '</strong>'; } },
  { label: 'Name', cell: function (s) { return esc(aval(s.first_name) + ' ' + aval(s.last_name)); } },
  { label: 'Email', cell: function (s) { return esc(aval(s.email)); } },
  { label: 'Phone', cell: function (s) { return esc(aval(s.phone)); } },
  { label: 'Department', cell: function (s) { return esc(s.department); } },
  { label: 'Level', cell: function (s) { return esc(s.level); } },
  { label: 'Gender', cell: function (s) { return esc(aval(s.gender)); } },
  { label: 'Allocation', cell: function (s) { return esc(place(s)); } },
  { label: 'Status', cell: function (s) {
    var a = (window.adminDashboardAllocations || []).find(function (x) { return Number(x.user_id) === Number(s.user_id); });
    return abadge(a ? String(aval(a.current_status, 'unallocated')).toLowerCase() : 'unallocated');
  } }
];
function view() {
  return all.filter(function (s) {
    var a = (window.adminDashboardAllocations || []).find(function (x) { return Number(x.user_id) === Number(s.user_id); });
    var status = a ? String(aval(a.current_status, 'unallocated')).toLowerCase() : 'unallocated';
    return (!q || (aval(s.first_name) + ' ' + aval(s.last_name) + ' ' + aval(s.matric_number) + ' ' + aval(s.email)).toLowerCase().indexOf(q) > -1) && (!dept || s.department === dept) && (!level || String(s.level) === level) && (!stat || status === stat);
  });
}
function render() {
  var rows = view(), pages = Math.max(1, Math.ceil(rows.length / PER));
  if (page > pages) page = pages;
  var shown = rows.slice((page - 1) * PER, page * PER);
  if (!shown.length) { aState(list, 'empty', 'No students match your filters.'); pager.innerHTML = ''; return; }
  list.innerHTML = tableHtml(COLS, '1fr 1fr 1fr 1.3fr 1.7fr 1.2fr 1.4fr .8fr .9fr 1.4fr 130px', shown, function (s) {
    var a = (window.adminDashboardAllocations || []).find(function (x) { return Number(x.user_id) === Number(s.user_id); });
    return { name: aval(s.first_name) + ' ' + aval(s.last_name), badge: abadge(a ? String(aval(a.current_status, 'unallocated')).toLowerCase() : 'unallocated'), meta: aval(s.matric_number) + ' \u00B7 ' + aval(s.department) + ' \u00B7 ' + aval(s.level), meta2: place(s) };
  }, { attrs: function (s) { return 'role="button" tabindex="0" data-id="' + s.student_id + '"'; }, active: function (s) { return Number(s.student_id) === selected; } });
  pager.innerHTML = pagerHtml(page, pages, shown.length, rows.length, 'students (' + total.toLocaleString() + ' records in total)');
}
function showPanel(id) {
  selected = id; render();
  var s = all.find(function (x) { return Number(x.student_id) === id; });
  var a = (window.adminDashboardAllocations || []).find(function (x) { return Number(x.user_id) === Number(s.user_id); });
  var p = a && (window.adminDashboardPayments || []).find(function (x) { return Number(x.allocation_id) === Number(a.allocation_id); });
  var pay = p ? abadge(p.status.toLowerCase()) : 'No invoice';
  panel.innerHTML = '<div class="a-who"><div class="a-avatar"></div><div><h2></h2><p class="a-caption"></p></div></div>' +
    '<div><div class="a-kv"><span>Department</span><span>' + esc(s.department) + '</span></div><div class="a-kv"><span>Level</span><span>' + esc(s.level) + '</span></div><div class="a-kv"><span>Email</span><span>' + esc(s.email) + '</span></div></div>' +
    '<h3>Current allocation</h3><div><div class="a-kv"><span>Hostel</span><span>' + (a ? esc(a.hostel_name) : 'Not allocated') + '</span></div><div class="a-kv"><span>Room / Bed</span><span>' + (a ? esc(a.room_number + ' / ' + a.bed_number) : '\u2014') + '</span></div><div class="a-kv"><span>Payment</span><span>' + pay + '</span></div></div>';
  panel.querySelector('h2').textContent = aval(s.first_name) + ' ' + aval(s.last_name); panel.querySelector('.a-caption').textContent = aval(s.matric_number);
  if (matchMedia('(max-width:1200px)').matches && id !== Number(all[0].student_id)) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
list.addEventListener('click', function (e) { var r = e.target.closest('[data-id]'); if (r) showPanel(+r.dataset.id); });
list.addEventListener('keydown', function (e) { var r = e.target.closest('[data-id]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showPanel(+r.dataset.id); } });
pager.addEventListener('click', function (e) { var b = e.target.closest('[data-p]'); if (b && !b.disabled) { page = +b.dataset.p; render(); } });
bindSearch(function (v) { q = v; page = 1; render(); });
[['f-dept', function (v) { dept = v; }], ['f-level', function (v) { level = v; }], ['f-status', function (v) { stat = v; }]].forEach(function (f) {
  document.getElementById(f[0]).onchange = function (e) { f[1](e.target.value); page = 1; render(); };
});
async function load() {
  aState(list, 'loading', 'Loading students...'); pager.innerHTML = ''; panel.innerHTML = '<p class="a-muted">Select a student to see details.</p>';
  var res = await adminApi.students();
  if (!res.success) return aState(list, 'error', res.message || 'Could not load students.', load);
  all = res.students; total = res.total_records || all.length;
  window.adminDashboardAllocations = res.allocations || [];
  window.adminDashboardPayments = res.payments || [];
  fillSelect('f-dept', all.map(function (s) { return s.department; })); fillSelect('f-level', all.map(function (s) { return String(s.level); }));
  render(); if (all.length) showPanel(Number(all[0].student_id));
}
load();
</script></body></html>
