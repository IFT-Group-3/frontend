<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme-preference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-appearance',t)}catch(e){}}());</script>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/admin.css"><title>Allocations | Hostel Administration</title></head>
<body class="a-body">
<main id="content">
  <div class="a-toolbar"><div class="a-find"><span class="fi"></span><input class="a-input" type="search" placeholder="Search allocations" aria-label="Search allocations"></div>
    <select class="a-input" id="f-session" aria-label="Filter by session"><option value="">All sessions</option></select>
    <select class="a-input" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option value="confirmed">Confirmed</option><option value="pending">Pending</option><option value="cancelled">Cancelled</option></select>
  </div>
  <div id="kpis"></div>
  <div class="a-card" style="padding:16px">
    <h2>Allocations</h2>
    <div class="a-rows" id="list"></div>
    <div class="a-pager" id="pager"></div>
  </div>
</main>
<script src="../../js/admin.js"></script>
<script>
const { ADMIN, esc, aval, naira, wait, failure, fetchJson, adminApi, adminSession, aicon, abadge, aState, aToast, mountAdminShell, bindSearch, pendingFeature, tableHtml, pagerHtml, kpiHtml, summaryHtml, fillSelect, downloadCsv } = AdminKit;
mountAdminShell({ active: 'allocations', title: 'Allocations', subtitle: 'Monitor current and historical bed assignments.', searchPlaceholder: 'Search allocations' });
document.querySelectorAll('.fi').forEach(function (e) { e.innerHTML = aicon('search'); });
var list = document.getElementById('list'), pager = document.getElementById('pager');
var all = [], q = '', sess = '', stat = '', page = 1, PER = 5;
var COLS = [
  { label: 'allocation_id', cell: function (a) { return esc(aval(a.allocation_id)); } },
  { label: 'user_id', cell: function (a) { return esc(aval(a.user_id)); } },
  { label: 'room_id', cell: function (a) { return esc(aval(a.room_id)); } },
  { label: 'bed_id', cell: function (a) { return esc(aval(a.bed_id)); } },
  { label: 'start_date', cell: function (a) { return esc(aval(a.start_date)); } },
  { label: 'end_date', cell: function (a) { return esc(aval(a.end_date)); } },
  { label: 'status', cell: function (a) { return esc(aval(a.status)); } },
  { label: 'expires_at', cell: function (a) { return esc(aval(a.expires_at)); } },
  { label: 'created_at', cell: function (a) { return esc(aval(a.created_at)); } },
  { label: 'confirmed_at', cell: function (a) { return esc(aval(a.confirmed_at)); } }
];
function view() {
  return all.filter(function (a) {
    return (!q || (String(aval(a.allocation_id)) + ' ' + String(aval(a.user_id)) + ' ' + String(aval(a.room_id)) + ' ' + String(aval(a.bed_id)) + ' ' + String(aval(a.start_date)) + ' ' + String(aval(a.end_date)) + ' ' + String(aval(a.status)) + ' ' + String(aval(a.expires_at)) + ' ' + String(aval(a.created_at)) + ' ' + String(aval(a.confirmed_at))).toLowerCase().indexOf(q) > -1) && (!sess || (a.start_date + ' - ' + a.end_date) === sess) && (!stat || String(aval(a.status)).toLowerCase() === stat);
  });
}
function render() {
  var rows = view(), pages = Math.max(1, Math.ceil(rows.length / PER));
  if (page > pages) page = pages;
  var shown = rows.slice((page - 1) * PER, page * PER);
  if (!shown.length) { aState(list, 'empty', 'No allocations match your filters.'); pager.innerHTML = ''; return; }
  list.innerHTML = tableHtml(COLS, '1fr 1fr 1fr 1fr 1.2fr 1.2fr 1fr 1.4fr 1.4fr 1.4fr', shown, function (a) {
    return { name: 'Allocation ' + aval(a.allocation_id), badge: abadge(String(aval(a.status, 'unallocated')).toLowerCase()), meta: 'user_id: ' + aval(a.user_id) + ' \u00B7 room_id: ' + aval(a.room_id) + ' \u00B7 bed_id: ' + aval(a.bed_id), meta2: aval(a.start_date) + ' - ' + aval(a.end_date) };
  });
  pager.innerHTML = pagerHtml(page, pages, shown.length, rows.length, 'allocations');
}
pager.addEventListener('click', function (e) { var b = e.target.closest('[data-p]'); if (b && !b.disabled) { page = +b.dataset.p; render(); } });
bindSearch(function (v) { q = v; page = 1; render(); });
[['f-session', function (v) { sess = v; }], ['f-status', function (v) { stat = v; }]].forEach(function (f) {
  document.getElementById(f[0]).onchange = function (e) { f[1](e.target.value); page = 1; render(); };
});
async function load() {
  aState(list, 'loading', 'Loading allocations...'); pager.innerHTML = '';
  var res = await adminApi.allocations();
  if (!res.success) return aState(list, 'error', res.message || 'Could not load allocations.', load);
  all = res.allocations;
  var counts = all.reduce(function (result, allocation) {
    var status = String(aval(allocation.status, 'unallocated')).toLowerCase();
    result[status] = (result[status] || 0) + 1;
    return result;
  }, {});
  document.getElementById('kpis').innerHTML = kpiHtml([
    { label: 'Confirmed', value: counts.confirmed || 0 },
    { label: 'Pending', value: counts.pending || 0 },
    { label: 'Cancelled', value: counts.cancelled || 0 },
    { label: 'Expired', value: counts.expired || 0 }
  ]) + summaryHtml([(counts.confirmed || 0) + ' Confirmed \u00B7 ' + (counts.pending || 0) + ' Pending']);
  fillSelect('f-session', all.map(function (a) { return aval(a.start_date) + ' - ' + aval(a.end_date); }));
  render();
}
load();
</script></body></html>
