<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme-preference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-appearance',t)}catch(e){}}());</script>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/admin.css">
<style>
  .a-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .a-member{display:flex;flex-direction:column;gap:12px}
  .a-member .a-who .a-avatar{display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--a-brand)}
  .a-member h3{font-size:16px}
  .a-member .work{font-size:14px;color:var(--a-text-2)}
  .a-built{display:flex;flex-wrap:wrap;gap:8px}
</style>
<title>Credits | Hostel Administration</title></head>
<body class="a-body">
<main id="content">
  <section class="a-card" style="display:flex;flex-direction:column;gap:8px">
    <h2>ROOMMATE</h2>
    <p class="a-muted">Hostel allocation and payment portal for the University of Ibadan. Built by IFT Group 3 for the 2026/2027 session.</p>
    <div class="a-built" id="built"></div>
  </section>
  <section>
    <div class="a-listhead"><h2>IFT Group 3</h2></div>
    <div class="a-team" id="team"></div>
  </section>
</main>
<script src="../../js/admin.js"></script>
<script>
const { esc, aicon, aState, mountAdminShell } = AdminKit;

/* Fill in the team here. Add one object per member, e.g. { name: 'Full name', matric: '250000', role: 'Admin frontend', work: 'What they built' }.
   Everything is escaped before it is shown. Leave a field out (for example matric) and it is simply not displayed. */
const TEAM = [
  { name: 'Steve Victor', matric: '250410' },
  { name: 'Abisoye Oyinkansola Osikomaiya', matric: '250404' },
  { name: 'Akinwale Abdullah Titilayo', matric: '251123' },
  { name: 'Mba Chibuike Moses', matric: '250379' },
  { name: 'Ogunlana Gift Oluwafikayomi', matric: '250389' },
  { name: 'Ekundayo Covenant', matric: '256614' },
  { name: 'Okorie Victory Chinonso', matric: '243689' },
  { name: 'Anucha Chidera Destiny Victor', matric: '250356' },
  { name: 'Oluwatumininu Owolabi', matric: '249488' },
  { name: 'Oduntan Afolake', matric: '250385' },
  { name: 'Borokinni Yusuf Temitope', matric: '243673' },
  { name: 'Femi-Akinwande Benjamin', matric: '250366' }
];
const BUILT_WITH = ['HTML', 'CSS', 'JavaScript', 'PHP', 'MySQL'];

mountAdminShell({ active: 'credits', title: 'Credits', subtitle: 'The team behind ROOMMATE.', searchPlaceholder: 'Search records' });
document.querySelector('.a-search').hidden = true;
document.getElementById('built').innerHTML = BUILT_WITH.map(function (t) { return '<span class="a-badge a-badge-neutral">' + esc(t) + '</span>'; }).join('');

var team = document.getElementById('team');
if (!TEAM.length) {
  aState(team, 'empty', 'The team list has not been filled in yet.');
} else {
  team.innerHTML = TEAM.map(function (m) {
    var initials = String(m.name || '?').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    return '<article class="a-card a-member"><div class="a-who"><div class="a-avatar">' + esc(initials) + '</div><div><h3>' + esc(m.name) + '</h3>' +
      '<p class="a-caption">' + esc(m.role || '') + (m.matric ? ' \u00B7 ' + esc(m.matric) : '') + '</p></div></div>' +
      (m.work ? '<p class="work">' + esc(m.work) + '</p>' : '') + '</article>';
  }).join('');
}
</script></body></html>
