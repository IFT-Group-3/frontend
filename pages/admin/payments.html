<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme-preference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-appearance',t)}catch(e){}}());</script>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/admin.css"><title>Payments | Hostel Administration</title></head>
<body class="a-body">
<main id="content">
  <div class="a-toolbar"><div class="a-find"><span class="fi"></span><input class="a-input" type="search" placeholder="Search invoices" aria-label="Search invoices"></div>
    <select class="a-input" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option value="paid">Paid</option><option value="pending">Pending</option><option value="failed">Failed</option></select>
    <button class="a-btn a-btn-primary" id="export">Export CSV</button>
  </div>
  <div id="kpis"></div>
  <div class="a-rows" id="list"></div><div class="a-pager" id="pager"></div></main>
<script src="../../js/admin.js"></script>
<script>
const { ADMIN, esc, aval, naira, wait, failure, fetchJson, adminApi, adminSession, aicon, abadge, aState, aToast, mountAdminShell, bindSearch, pendingFeature, tableHtml, pagerHtml, kpiHtml, summaryHtml, fillSelect, downloadCsv } = AdminKit;
mountAdminShell({ active: 'payments', title: 'Payments', subtitle: 'Track accommodation invoices and transactions.', searchPlaceholder: 'Search invoices' });
document.querySelectorAll('.fi').forEach(function (e) { e.innerHTML = aicon('search'); });
var list = document.getElementById('list'), pager = document.getElementById('pager');
var all = [], q = '', stat = '', page = 1, PER = 5;
var COLS = [
  { label: 'Payment ID', cell: function (p) { return esc(aval(p.payment_id)); } },
  { label: 'Allocation ID', cell: function (p) { return esc(aval(p.allocation_id)); } },
  { label: 'Invoice', cell: function (p) { return '<strong>' + esc(aval(p.reference)) + '</strong>'; } },
  { label: 'Student', cell: function (p) { return esc(aval(p.first_name) + ' ' + aval(p.last_name)); } },
  { label: 'Amount (kobo)', cell: function (p) { return esc(aval(p.amount_kobo, 0)); } },
  { label: 'Amount (NGN)', cell: function (p) { return naira(aval(p.amount_ngn, 0)); } },
  { label: 'Gateway reference', cell: function (p) { return esc(aval(p.gateway_reference)); } },
  { label: 'Date', cell: function (p) { return esc(p.created_at); } },
  { label: 'Updated', cell: function (p) { return esc(aval(p.updated_at)); } },
  { label: 'Status', cell: function (p) { return abadge(String(aval(p.status, 'pending')).toLowerCase()); } }
];
function view() {
  return all.filter(function (p) {
    return (!q || (aval(p.reference) + ' ' + aval(p.first_name) + ' ' + aval(p.last_name) + ' ' + aval(p.student_email)).toLowerCase().indexOf(q) > -1) && (!stat || String(aval(p.status, 'pending')).toLowerCase() === stat);
  });
}
function render() {
  var rows = view(), pages = Math.max(1, Math.ceil(rows.length / PER));
  if (page > pages) page = pages;
  var shown = rows.slice((page - 1) * PER, page * PER);
  if (!shown.length) { aState(list, 'empty', 'No payments match your filters.'); pager.innerHTML = ''; return; }
  list.innerHTML = tableHtml(COLS, '1fr 1fr 1.3fr 1.2fr .9fr .9fr 1.3fr 1fr 1fr 120px', shown, function (p) {
    return { name: aval(p.reference), badge: abadge(String(aval(p.status, 'pending')).toLowerCase()), meta: aval(p.first_name) + ' ' + aval(p.last_name) + ' \u00B7 ' + aval(p.reference), meta2: naira(aval(p.amount_ngn, 0)) + ' \u00B7 ' + aval(p.created_at) };
  });
  pager.innerHTML = pagerHtml(page, pages, shown.length, rows.length, 'payments');
}
pager.addEventListener('click', function (e) { var b = e.target.closest('[data-p]'); if (b && !b.disabled) { page = +b.dataset.p; render(); } });
bindSearch(function (v) { q = v; page = 1; render(); });
document.getElementById('f-status').onchange = function (e) { stat = e.target.value; page = 1; render(); };
document.getElementById('export').onclick = function () {
  var rows = view();
  if (!rows.length) return aToast('There are no payments to export.');
  downloadCsv('payments.csv', ['Payment ID', 'Allocation ID', 'Reference', 'Student', 'Amount (kobo)', 'Amount (NGN)', 'Gateway reference', 'Created', 'Updated', 'Status'],
    rows.map(function (p) { return [p.payment_id, p.allocation_id, p.reference, aval(p.first_name) + ' ' + aval(p.last_name), p.amount_kobo, p.amount_ngn, p.gateway_reference, p.created_at, p.updated_at, p.status]; }));
  aToast('Exported ' + rows.length + ' payments.');
};
async function load() {
  aState(list, 'loading', 'Loading payments...'); pager.innerHTML = '';
  var res = await adminApi.payments();
  if (!res.success) return aState(list, 'error', res.message || 'Could not load payments.', load);
  all = res.payments;
  var counts = all.reduce(function (result, payment) {
    var status = String(aval(payment.status, 'pending')).toLowerCase();
    result[status] = (result[status] || 0) + 1;
    return result;
  }, {});
  var collected = all.filter(function (payment) { return payment.status === 'Paid'; })
    .reduce(function (total, payment) { return total + Number(payment.amount_ngn); }, 0);
  document.getElementById('kpis').innerHTML = kpiHtml([
    { label: 'Collected', value: naira(collected) },
    { label: 'Pending', value: counts.pending || 0 },
    { label: 'Failed', value: counts.failed || 0 }
  ]) + summaryHtml([naira(collected) + ' Collected', (counts.pending || 0) + ' Pending \u00B7 ' + (counts.failed || 0) + ' Failed']);
  render();
}
load();
</script></body></html>
