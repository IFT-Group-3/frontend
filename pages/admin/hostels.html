<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme-preference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-appearance',t)}catch(e){}}());</script>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/admin.css"><title>Hostels | Hostel Administration</title></head>
<body class="a-body">
<main id="content">
  <div class="a-toolbar">
    <div class="a-find"><span id="find-icon"></span><input class="a-input" type="search" placeholder="Search hostels" aria-label="Search hostels"></div>
    <select class="a-input" id="f-type" aria-label="Filter by type"><option value="">All types</option><option>Male</option><option>Female</option><option>Mixed</option></select>
    <select class="a-input" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option value="available">Available</option><option value="unavailable">Unavailable</option></select>
    <button class="a-btn a-btn-primary" id="add"></button>
  </div>
  <div class="a-card" style="padding:16px">
    <h2>Hostels</h2>
    <div class="a-rows" id="list"></div>
  </div>
  <div class="a-pager" id="pager"></div>
</main>
<script src="../../js/admin.js"></script>
<script>
const { ADMIN, esc, aval, naira, wait, failure, fetchJson, adminApi, adminSession, aicon, abadge, aState, aToast, mountAdminShell, bindSearch, pendingFeature, tableHtml, pagerHtml, kpiHtml, summaryHtml, fillSelect, downloadCsv } = AdminKit;
mountAdminShell({ active: 'hostels', title: 'Hostels', subtitle: 'Manage hostel inventory, capacity and status.', searchPlaceholder: 'Search hostels' });
document.getElementById('find-icon').innerHTML = aicon('search');
document.getElementById('add').innerHTML = '+ Add Hostel';
document.getElementById('add').onclick = pendingFeature('Add hostel');
var list = document.getElementById('list'), pager = document.getElementById('pager');
var all = [], q = '', type = '', status = '', page = 1, PER = 6;

function view() {
  return all.filter(function (h) {
    return (!q || (String(aval(h.hostel_id)) + ' ' + String(aval(h.hostel_name)) + ' ' + String(aval(h.hostel_type)) + ' ' + String(aval(h.location)) + ' ' + String(aval(h.description)) + ' ' + String(aval(h.total_rooms)) + ' ' + String(aval(h.status)) + ' ' + String(aval(h.image_path))).toLowerCase().indexOf(q) > -1) && (!type || h.hostel_type === type) && (!status || String(aval(h.status, 'unavailable')).toLowerCase() === status);
  });
}
var COLS = [
  { label: 'hostel_id', cell: function (h) { return esc(aval(h.hostel_id)); } },
  { label: 'hostel_name', cell: function (h) { return esc(aval(h.hostel_name)); } },
  { label: 'hostel_type', cell: function (h) { return esc(aval(h.hostel_type)); } },
  { label: 'location', cell: function (h) { return esc(aval(h.location)); } },
  { label: 'description', cell: function (h) { return esc(aval(h.description)); } },
  { label: 'total_rooms', cell: function (h) { return esc(aval(h.total_rooms)); } },
  { label: 'status', cell: function (h) { return esc(aval(h.status)); } },
  { label: 'image_path', cell: function (h) { return esc(aval(h.image_path)); } }
];
function render() {
  var rows = view(), pages = Math.max(1, Math.ceil(rows.length / PER));
  if (page > pages) page = pages;
  var shown = rows.slice((page - 1) * PER, page * PER);
  if (!shown.length) { aState(list, 'empty', 'No hostels match your filters.'); pager.innerHTML = ''; return; }
  list.innerHTML = tableHtml(COLS, '1fr 1.4fr 1fr 1.4fr 2fr .9fr 1fr 1.6fr', shown, function (h) {
    return {
      name: aval(h.hostel_name),
      badge: abadge(String(aval(h.status, 'unavailable')).toLowerCase()),
      meta: 'hostel_id: ' + aval(h.hostel_id) + ' \u00B7 ' + aval(h.hostel_type) + ' \u00B7 ' + aval(h.location),
      meta2: 'total_rooms: ' + aval(h.total_rooms)
    };
  });
  var btns = '<button class="a-btn a-btn-ghost" data-p="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>Previous</button>';
  for (var i = 1; i <= pages; i++) btns += '<button class="a-btn a-btn-ghost" data-p="' + i + '"' + (i === page ? ' aria-current="page"' : '') + '>' + i + '</button>';
  btns += '<button class="a-btn a-btn-ghost" data-p="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>Next</button>';
  pager.innerHTML = '<span>Showing ' + shown.length + ' of ' + rows.length + ' hostels</span><div class="btns">' + btns + '</div>';
}
pager.addEventListener('click', function (e) { var b = e.target.closest('[data-p]'); if (b && !b.disabled) { page = +b.dataset.p; render(); } });
bindSearch(function (v) { q = v; page = 1; render(); });
document.getElementById('f-type').onchange = function (e) { type = e.target.value; page = 1; render(); };
document.getElementById('f-status').onchange = function (e) { status = e.target.value; page = 1; render(); };
async function load() {
  aState(list, 'loading', 'Loading hostels...'); pager.innerHTML = '';
  var res = await adminApi.hostels();
  if (!res.success) return aState(list, 'error', res.message || 'Could not load hostels.', load);
  all = res.hostels || [];
  render();
}
load();
</script></body></html>
